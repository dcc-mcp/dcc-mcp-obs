name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-format:
    name: Native format contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: ./.github/actions/run-clang-format
        with:
          failCondition: error
      - uses: ./.github/actions/run-gersemi
        with:
          failCondition: error

  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.10"
          - os: windows-2022
            python: "3.13"
          - os: macos-14
            python: "3.13"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Skill contract
        shell: bash
        run: |
          dcc-mcp-cli lint src/dcc_mcp_obs/skills/obs-control \
            --warnings-as-errors --output json

  python-package:
    name: Python package and installed-wheel smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and check
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build
          python -m twine check dist/*
      - name: External-directory installed-wheel smoke
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/obs-wheel-smoke"
          "$RUNNER_TEMP/obs-wheel-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/obs-wheel-smoke/bin/dcc-mcp-obs" --version
          "$RUNNER_TEMP/obs-wheel-smoke/bin/python" -c \
            "from pathlib import Path; import dcc_mcp_obs; p=Path(dcc_mcp_obs.__file__).parent/'skills'/'obs-control'/'tools.yaml'; assert p.is_file()"

  native:
    name: Native plugin / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x64
            platform: windows
          - os: macos-14
            target: universal
            platform: macos
          - os: ubuntu-24.04
            target: x86_64
            platform: linux
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Build native plugin
        uses: ./.github/actions/build-plugin
        with:
          target: ${{ matrix.target }}
          config: RelWithDebInfo
      - name: Create canonical installer bundle
        run: >-
          python tools/create_plugin_bundle.py
          --root release/RelWithDebInfo
          --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.platform }}
          path: dcc-mcp-obs-*.zip
          if-no-files-found: error
          retention-days: 7
