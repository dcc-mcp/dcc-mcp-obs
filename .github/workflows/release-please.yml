name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@cc61a07e2da466bebbc19af50461e02817a9d8be
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
