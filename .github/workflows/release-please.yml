name: Release Please

on:
  workflow_call:
    outputs:
      release_created:
        value: ${{ jobs.release-please.outputs.release_created }}
      tag:
        value: ${{ jobs.release-please.outputs.tag }}
      sha:
        value: ${{ jobs.release-please.outputs.sha }}
      release_id:
        value: ${{ jobs.release-please.outputs.release_id }}

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
