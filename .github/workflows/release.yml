name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  python-artifacts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  native-artifacts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x64
            platform: windows
          - os: macos-15
            target: universal
            platform: macos
          - os: ubuntu-24.04
            target: x86_64
            platform: linux
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Bind tag to source and version
        shell: bash
        run: |
          python tools/check_release_version.py
          test "$(git rev-list -n 1 "$GITHUB_REF")" = "$GITHUB_SHA"
      - name: Build native plugin
        uses: ./.github/actions/build-plugin
        with:
          target: ${{ matrix.target }}
          config: Release
      - name: Create canonical installer bundle
        run: >-
          python tools/create_plugin_bundle.py
          --root release/Release
          --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.platform }}
          path: dcc-mcp-obs-*.zip
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [python-artifacts, native-artifacts]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-artifacts
      - name: Freeze artifact manifest
        shell: bash
        run: |
          find release-artifacts -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          test "$(find release-artifacts -type f | wc -l)" -eq 5
      - name: Verify no-clobber publication targets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python tools/check_release_version.py
          test "$(git rev-list -n 1 "$GITHUB_REF")" = "$GITHUB_SHA"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists" >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          artifacts = sorted(Path("release-artifacts").rglob("*"))
          files = [path for path in artifacts if path.is_file()]
          wheels = [path for path in files if path.suffix == ".whl"]
          sdists = [path for path in files if path.name.endswith(".tar.gz")]
          native = [path for path in files if path.suffix == ".zip"]
          if len(wheels) != 1 or len(sdists) != 1 or len(native) != 3:
              raise SystemExit("release artifact set is not exact")
          with zipfile.ZipFile(wheels[0]) as archive:
              if not any(name.endswith(".dist-info/METADATA") for name in archive.namelist()):
                  raise SystemExit("wheel metadata is missing")
          with tarfile.open(sdists[0]) as archive:
              if not any(member.name.endswith("/PKG-INFO") for member in archive.getmembers()):
                  raise SystemExit("sdist metadata is missing")
          PY
      - name: Publish Python distributions
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc
        with:
          packages-dir: release-artifacts/python-dist
          attestations: true
          print-hash: true
      - name: Publish no-clobber GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python tools/check_release_version.py
          test "$(git rev-list -n 1 "$GITHUB_REF")" = "$GITHUB_SHA"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            SHA256SUMS release-artifacts/native-*/*.zip release-artifacts/python-dist/*
