name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-please:
    uses: ./.github/workflows/release-please.yml
    permissions:
      contents: write
      pull-requests: write

  identity:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
      RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
      RELEASE_ID: ${{ needs.release-please.outputs.release_id }}
    outputs:
      tag: ${{ needs.release-please.outputs.tag }}
      sha: ${{ needs.release-please.outputs.sha }}
      release_id: ${{ needs.release-please.outputs.release_id }}
    steps:
      - name: Validate caller before checkout
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = "dcc-mcp/dcc-mcp-obs"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Verify Release Please handoff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/release_delivery.py check

  python-artifacts:
    needs: identity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.identity.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  native-artifacts:
    needs: identity
    env:
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
      RELEASE_SHA: ${{ needs.identity.outputs.sha }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x64
            platform: windows
          - os: macos-15
            target: universal
            platform: macos
          - os: ubuntu-24.04
            target: x86_64
            platform: linux
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.identity.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Bind tag to source and version
        shell: bash
        run: |
          GITHUB_REF_NAME="$RELEASE_TAG" python tools/check_release_version.py
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Build native plugin
        uses: ./.github/actions/build-plugin
        with:
          target: ${{ matrix.target }}
          config: Release
      - name: Create canonical installer bundle
        run: >-
          python tools/create_plugin_bundle.py
          --root release/Release
          --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.platform }}
          path: dcc-mcp-obs-*.zip
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [identity, python-artifacts, native-artifacts]
    env:
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
      RELEASE_SHA: ${{ needs.identity.outputs.sha }}
      RELEASE_ID: ${{ needs.identity.outputs.release_id }}
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.identity.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-artifacts
      - name: Freeze artifact manifest
        shell: bash
        run: |
          find release-artifacts -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          test "$(find release-artifacts -type f | wc -l)" -eq 5
      - name: Verify no-clobber publication targets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python tools/release_delivery.py check
      - name: Attach artifacts to the exact Release Please release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/release_delivery.py upload
      - name: Publish Python distributions
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc
        with:
          packages-dir: release-artifacts/python-dist
          attestations: true
          print-hash: true
