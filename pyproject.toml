[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp-obs"
version = "0.1.0" # x-release-please-version
description = "Native OBS Studio control for the DCC-MCP ecosystem"
readme = "README.md"
license = { text = "GPL-2.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "Long Hao", email = "hal.long@outlook.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "dcc-mcp-core>=0.20.14,<1.0.0",
  "psutil>=5.9,<8",
  "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "jsonschema>=4.23,<5",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "pyyaml>=6,<7",
  "ruff>=0.12,<1",
  "twine>=6,<7",
  "websockets>=15,<16",
]

[project.scripts]
dcc-mcp-obs = "dcc_mcp_obs.server:main"
dcc-mcp-obs-install = "dcc_mcp_obs.install_cli:main"

[project.entry-points."dcc_mcp.adapters"]
obs = "dcc_mcp_obs:ObsMcpServer"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_mcp_obs"]
artifacts = ["src/dcc_mcp_obs/skills/**"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/LICENSE",
  "/contracts",
  "/docs",
  "/native",
  "/skills",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
exclude = [".deps", ".venv*", "build*", "release", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
