    input_schema:
      type: object
      properties: {output_name: {type: string, minLength: 1, maxLength: 256}}
      required: [output_name]
      additionalProperties: false
    output_schema:
      type: object
      additionalProperties: false
      required: [success, message, error, prompt, context, postcondition]
      properties:
        <<: *output_status_properties
        postcondition:
          type: object
          additionalProperties: false
          required: [verified]
          properties: {verified: {const: true}}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: true, open_world_hint: false, deferred_hint: false}
    call_examples: [{arguments: {output_name: streaming}, note: Stop one typed output only after explicit operator intent.}]
    next-tools: {on-success: [obs_control__get_output_status], on-failure: [obs_control__get_status]}
