tools:
  - name: get_status
    description: Get exact native OBS plugin and host readiness.
    source_file: scripts/get_status.py
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema:
      type: object
      additionalProperties: false
      required: [success, message, error, prompt, context]
      properties:
        success: {const: true}
        message: {type: string}
        error: {type: "null"}
        prompt: {type: [string, "null"]}
        context:
          type: object
          additionalProperties: false
          required: [instanceId, pluginVersion, obsVersion, hostPid, eventSequence, ok, ready]
          properties:
            instanceId: {type: string, minLength: 1, maxLength: 128}
            pluginVersion: {type: string, minLength: 1}
            obsVersion: {type: string, minLength: 1}
            hostPid: {type: integer, minimum: 1}
            eventSequence: {type: integer, minimum: 0}
            ok: {const: true}
            ready: {const: true}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 10
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}
    call_examples: [{arguments: {}, note: Bind this Agent run to one exact native OBS plugin instance.}]
    next-tools: {on-failure: [obs_control__get_status]}
  - name: list_scenes
    description: List bounded scenes and identify the current scene.
    source_file: scripts/list_scenes.py
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema:
      type: object
      additionalProperties: false
      required: [success, message, error, prompt, context]
      properties:
        success: {const: true}
        message: {type: string}
        error: {type: "null"}
        prompt: {type: [string, "null"]}
        context:
          type: object
          additionalProperties: false
          required: [instanceId, pluginVersion, obsVersion, hostPid, eventSequence, ok, scenes, truncated]
          properties:
            instanceId: {type: string, minLength: 1, maxLength: 128}
            pluginVersion: {type: string, minLength: 1}
            obsVersion: {type: string, minLength: 1}
            hostPid: {type: integer, minimum: 1}
            eventSequence: {type: integer, minimum: 0}
            ok: {const: true}
            currentSceneName: {type: string, maxLength: 256}
            scenes:
              type: array
              maxItems: 256
              items:
                type: object
                additionalProperties: false
                required: [sceneName]
                properties: {sceneName: {type: string, minLength: 1, maxLength: 256}}
            truncated: {type: boolean}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 10
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}
    call_examples: [{arguments: {}, note: Discover scenes before reading sources for one scene.}]
    next-tools: {on-success: [obs_control__list_sources], on-failure: [obs_control__get_status]}
  - name: list_sources
    description: List bounded sources for the current or named scene.
    source_file: scripts/list_sources.py
    input_schema:
      type: object
      properties: {scene_name: {type: string, minLength: 1, maxLength: 256}}
      additionalProperties: false
    output_schema:
      type: object
      additionalProperties: false
      required: [success, message, error, prompt, context]
      properties:
        success: {const: true}
        message: {type: string}
        error: {type: "null"}
        prompt: {type: [string, "null"]}
        context:
          type: object
          additionalProperties: false
          required: [instanceId, pluginVersion, obsVersion, hostPid, eventSequence, ok, sceneName, sources, truncated]
          properties:
            instanceId: {type: string, minLength: 1, maxLength: 128}
            pluginVersion: {type: string, minLength: 1}
            obsVersion: {type: string, minLength: 1}
            hostPid: {type: integer, minimum: 1}
            eventSequence: {type: integer, minimum: 0}
            ok: {const: true}
            sceneName: {type: string, minLength: 1, maxLength: 256}
            sources:
              type: array
              maxItems: 512
              items:
                type: object
                additionalProperties: false
                required: [sceneItemId, sourceName, sourceKind, enabled]
                properties:
                  sceneItemId: {type: integer}
                  sourceName: {type: string, minLength: 1, maxLength: 256}
                  sourceKind: {type: string, minLength: 1, maxLength: 256}
                  enabled: {type: boolean}
            truncated: {type: boolean}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 10
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}
    call_examples: [{arguments: {scene_name: Main}, note: Read the bounded source list for one exact scene.}]
    next-tools: {on-failure: [obs_control__list_scenes, obs_control__get_status]}
  - name: get_recording_status
    description: Get recording active and paused state.
    source_file: scripts/get_recording_status.py
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: &recording_status_output
      type: object
      additionalProperties: false
      required: [success, message, error, prompt, context]
      properties:
        success: {const: true}
        message: {type: string}
        error: {type: "null"}
        prompt: {type: [string, "null"]}
        context:
          type: object
          additionalProperties: false
          required: [instanceId, pluginVersion, obsVersion, hostPid, eventSequence, ok, outputActive, outputPaused]
          properties:
            instanceId: {type: string, minLength: 1, maxLength: 128}
            pluginVersion: {type: string, minLength: 1}
            obsVersion: {type: string, minLength: 1}
            hostPid: {type: integer, minimum: 1}
            eventSequence: {type: integer, minimum: 0}
            ok: {const: true}
            outputActive: {type: boolean}
            outputPaused: {type: boolean}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 10
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}
    call_examples: [{arguments: {}, note: Inspect recording state before a mutation.}]
    next-tools: {on-failure: [obs_control__get_status]}
  - name: start_recording
    description: Start recording and require exact active-state readback.
    source_file: scripts/start_recording.py
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: &recording_mutation_output
      type: object
      additionalProperties: false
      required: [success, message, error, prompt, context, postcondition]
      properties:
        success: {const: true}
        message: {type: string}
        error: {type: "null"}
        prompt: {type: [string, "null"]}
        postcondition:
          type: object
          additionalProperties: false
          required: [verified]
          properties:
            verified: {const: true}
        context:
          type: object
          additionalProperties: false
          required: [instanceId, pluginVersion, obsVersion, hostPid, eventSequence, ok, outputActive, outputPaused]
          properties:
            instanceId: {type: string, minLength: 1, maxLength: 128}
            pluginVersion: {type: string, minLength: 1}
            obsVersion: {type: string, minLength: 1}
            hostPid: {type: integer, minimum: 1}
            eventSequence: {type: integer, minimum: 0}
            ok: {const: true}
            outputActive: {type: boolean}
            outputPaused: {type: boolean}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: true, open_world_hint: false, deferred_hint: false}
    call_examples: [{arguments: {}, note: Start recording only after explicit user intent.}]
    next-tools: {on-success: [obs_control__get_recording_status], on-failure: [obs_control__get_status]}
  - name: stop_recording
    description: Stop recording and require exact inactive-state readback.
    source_file: scripts/stop_recording.py
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: *recording_mutation_output
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: true, open_world_hint: false, deferred_hint: false}
    call_examples: [{arguments: {}, note: Stop the bound OBS recording and verify it is inactive.}]
    next-tools: {on-success: [obs_control__get_recording_status], on-failure: [obs_control__get_status]}
  - name: pause_recording
    description: Pause active recording and require exact paused-state readback.
    source_file: scripts/pause_recording.py
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: *recording_mutation_output
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: true, open_world_hint: false, deferred_hint: false}
    call_examples: [{arguments: {}, note: Pause an active recording and verify the paused state.}]
    next-tools: {on-success: [obs_control__get_recording_status], on-failure: [obs_control__get_status]}
  - name: resume_recording
    description: Resume paused recording and require exact unpaused-state readback.
    source_file: scripts/resume_recording.py
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: *recording_mutation_output
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: true, open_world_hint: false, deferred_hint: false}
    call_examples: [{arguments: {}, note: Resume a paused recording and verify it is unpaused.}]
    next-tools: {on-success: [obs_control__get_recording_status], on-failure: [obs_control__get_status]}
